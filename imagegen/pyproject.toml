[project]
name = "white-buffalo-imagegen"
version = "0.1.0"
description = "Illustration pipeline for White Buffalo"
requires-python = ">=3.11,<3.15"
dependencies = [
    # 2026-07-14: torch/vision floors raised for Python 3.14 (cp314 wheels
    # start at torch 2.9; cu124 index never got them -> cu128). Original
    # known-working ../z-image pins were torch>=2.5,<2.7 on cu124/py3.12.
    "torch>=2.9,<2.11",
    "torchvision>=0.24,<0.26",
    "diffusers @ git+https://github.com/huggingface/diffusers@a2ea45a5da7f9d4b197ee5da7481768bf865f7d1",
    "transformers==4.56.1",
    "accelerate==1.6.0",
    "huggingface-hub==0.34.3",
    "safetensors>=0.5.3",  # ==0.4.5 has no cp314 wheel; sdist needs pyo3<3.14
    "pillow>=10.0",
    "sentencepiece>=0.2",
    # bitsandbytes deliberately absent: training-only, and its eager triton
    # import breaks on NixOS (JIT gcc compile). Training env is separate.
    "einops==0.7.0",
    "toml==0.10.2",
    "tqdm",
    "peft>=0.19.1",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]
environments = ["sys_platform == 'linux'"]
