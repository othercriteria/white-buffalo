# White Buffalo — illustration prompt catalog v1
#
# Discipline (planning/image-gen.md): every visual claim below traces to
# notes/visual-bible.md and through it to a cited line in drafts/. Citations
# are file:line into drafts/. Anything the text leaves open is listed under
# `underdetermined` — the model may fill it, but no prompt may assert it.
# Character consistency for underdetermined features comes later via LoRA
# reference sets (DK approves the reference before training locks a face).
#
# Prompts are STYLE-FREE scene content. Style register (engraving / painterly /
# photographic) is applied as a prefix at generation time; candidates live in
# styles.toml pending the A/B decision (plan step 5).
#
# Do-not-illustrate (visual-bible §DNI): no Hardin killings (traces only:
# graves, scrubbed stain, broken chair), no Morrow death event (traces only:
# churned snow, the corpse as found, blood on her chest/forelegs), no ending
# resolution, no Lakota interiority. Each entry notes its DNI posture.
#
# PLATE POLICY (2026-07-08, planning/image-gen.md): journal entries may show
# Morrow (LoRA'd); Farrell chapters contribute evidence/places only; FARRELL
# IS NEVER DEPICTED — compose from behind his eyes where his position
# matters. Entries conflicting with this are marked shelved-by-policy.
#
# GAP FILLS TRIGGERED (2026-07-10, planning/assembly.md): ferry-bridge
# generated per DK's standing rule (Ch 2+3 = the book's largest bare
# stretch); two-stories proposed and DK-blessed (Ch 9, longest back-half
# run). Held for a later pass: blizzard-recomposition (horse's mane in
# the whiteout), frozen-hand (Ch 5, taste), ridge-watcher (JE VII,
# cleverness).

