# HIRES ADOPTED (2026-07-18): x2 d0.35 single-round.
# Gap fill #2 (assembly.md, DK-blessed): Ch 9's first sight of them,
# breaking the longest back-half bare run. From behind Farrell's eyes
# (mounted, halted — neither he nor the horse appears). THE COW IS
# DELIBERATELY ABSENT: the plate renders his exact percept — "The
# buffalo I could not find at first. She was lost in the white, and I
# found her only when she moved" — and a plate cannot move. Her absence
# is the subject; do not "fix" by adding her. The man stays a speck
# (the engraver's honest mile, unlike the finale's necessary
# compression). No LoRA — identity illegible at this scale by design.
# v2 (2026-07-14, DK register re-cut with tracks-north): same wrong-
# medium diagnosis — feathery wash ridges, no committed blacks (the
# speck of the man is the plate's only dark). Content UNTOUCHED (the
# absent cow stays absent; the man stays a speck). The design's
# white-space-and-distance is redefined in the idiom's terms:
# emptiness = reserved paper against hatched darks, not uniform pale
# wash.
# v2.1 (2026-07-14): v2's "valley sides modeled with hatching" made
# the sides the SUBJECT — all 8 renders alpine glacial troughs with
# rock crags (negative lost wholesale) vs 17:75 "ridges that seemed
# too far away to matter." Sides clause CUT; flatness asserted
# positively (low ridges far off, low against the sky, no rock
# anywhere); gorge/fjord family negated.
# PROMOTED s1015 v2.1 (DK bless 2026-07-14): wide shallow valley,
# ridges low and far, floor reserved paper white, two parallel
# dotted trails (heavier/lighter), ONE dark figure walking away,
# the cow rightly absent. s1012 was compositionally purer but
# rendered TWO figures at the trail's end — fatal in a plate about
# one visible story and one invisible one. s1014 grew a third
# trail; s1011 a frame rule; s1016 fused a trail continuous.
